notes: 'UniProt O24676 is named Chlorobenzene dioxygenase subunit alpha and balances one reaction, on chlorobenzene (RHEA:57512); the primary paper (Beil 1997) is titled for the broad-spectrum chlorobenzene dioxygenase. The substrate recorded here was 1,2,4,5-tetrachlorobenzene until 2026-11-12, which made this record claim official-equation support for a molecule that equation does not mention. The tetrachlorobenzene activity is why the operon is called tec and is kept here rather than dropped: the enzyme dioxygenates a chlorine-bearing carbon of 1,2,4,5-tetrachlorobenzene, and the unstable diol rearomatises with loss of chloride to 3,4,6-trichlorocatechol (Beil 1997; sequence elements responsible identified in Beil 1998). That product is a catechol, not the cis-dihydrodiol this record used to name.'
