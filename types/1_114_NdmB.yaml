notes: 'UniProt H9N290 names theobromine as the substrate of the reaction it balances (RHEA:30319), and the same entry records three further documented N3-demethylations by this enzyme: caffeine to paraxanthine, theophylline to 1-methylxanthine, and 3-methylxanthine to xanthine (Summers 2012). The substrate recorded here was caffeine until 2026-11-12; that reaction is real but secondary, and naming it made this type indistinguishable from NdmA, whose substrate is also caffeine. What separates the two is the position demethylated: N1 for NdmA, N3 here.'
