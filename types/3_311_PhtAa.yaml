source: 'UniProt Q6UP13 (Q6UP13_MYCAO) and GenBank AAQ91914.2 (gene phtAa, product PhtAa, 487 aa); stored sequence verified byte-identical to BOTH on 2026-10-28. Characterised in Stingley et al., Microbiology 2004;150:3749-3761, doi:10.1099/mic.0.27263-0 (phthalate degradation operon of Mycobacterium vanbaalenii PYR-1). Note: Q6UP13 is unreviewed with protein existence ''Inferred from homology'', and the two records disagree on the organism (UniProt M. austroafricanum, GenBank M. vanbaalenii PYR-1) through reclassification'
source_kind: paper
curation_confidence: high
notes: 'plasticiser hydrolysis product. PRODUCT CORRECTED 2026-11-01: the record gave cis-4,5-dihydroxy-4,5-dihydrophthalate, which is the GRAM-NEGATIVE route. Actinobacteria oxidise phthalate at ring positions 3 and 4. Stingley et al. 2004 (doi:10.1099/mic.0.27263-0) state that a 6.7 kb fragment carrying this operon converts phthalate to 3,4-dihydroxyphthalate, so this enzyme is a phthalate 3,4-dioxygenase. The product of PhtAa and of 4_406_PDO had been exchanged with each other.'
