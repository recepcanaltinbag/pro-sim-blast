notes: 'TENTATIVE. The cadABC genes of Bradyrhizobium sp. HW13 encode a phenoxyacetate herbicide oxygenase whose large subunit is CadA; the cited work discusses both 2,4-D and 2,4,5-T activity, so the exact preferred substrate of this reference is not settled here. Its profile places it next to TftA, the 2,4,5-T enzyme, which is consistent. ORGANISM AND SOURCE CORRECTED 2026-10-28. The record cited ''J Bacteriol 2002;184:509-518 (Bradyrhizobium sp. HW13, cadABC)'', but the stored sequence is NOT the Bradyrhizobium HW13 CadA (UniProt Q8VUZ2, also 448 aa but only about 85% identical, with a one-residue indel near the N-terminus). It is byte-identical to GenBank AGU69349.1, the Sphingomonas sp. ERG5 CadA. The substrate 2,4-D is CORRECT and is now sourced: the GenBank record itself calls the protein the large subunit of 2,4-D oxygenase. This also closes the roadmap question of whether the substrate was 2,4-D or 2,4,5-T -- that question rested on the wrong paper.'
