oxygen_fate_basis: 'no NET oxygen is gained: choline C5H14NO+ -> betaine aldehyde C5H12NO+ is a loss of two hydrogens with no change in oxygen count (PubChem CID 305 -> 249). This enzyme is a genuine Rieske-type MONOOXYGENASE and an oxygen atom is inserted; what is NOT established is whether that particular atom stays in the product. The carbon being hydroxylated already carries a hydroxyl, so the insertion gives a gem-diol whose two hydroxyls sit on the same carbon and are equivalent, and either can leave on dehydration. Only 18O2 labelling could resolve it, and none of the sources held here reports it. The value therefore claims only the net count, not the fate of the atom.'
