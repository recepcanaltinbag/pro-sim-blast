oxygen_fate: transient
oxygen_fate_basis: 'oxygen is inserted but NOT RETAINED. The hydroxylated carbon forms a gem-diol that loses water, so the product keeps none of it: choline C5H14NO+ -> betaine aldehyde C5H12NO+ is a loss of two hydrogens with no gain of oxygen (PubChem CID 305 -> 249). This enzyme is a genuine Rieske-type monooxygenase and the mechanism is a hydroxylation; the value records where the oxygen ENDS UP, not what the enzyme does.'
