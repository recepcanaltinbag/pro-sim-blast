notes: 'First C-C bond cleavage reference in this set. AerC performs oxidative carbocyclisation and then cleaves a C-C bond in one active site, building the Delta3-pyrroline ring of Aeap with the loss of three carbon atoms; the authors call it a unique route to heterocycle formation. reaction_class records the cleavage because that is the chemistry the set lacked, but the enzyme also forms a C-C bond: reaction_class holds one value per type, which is a limit of the schema and not of the enzyme. IDENTIFICATION. The paper names the enzyme ScAerC from Scytonema sp. NIES-4073 but gives no accession, and the survey first rejected it for that reason. The organism has since been renamed Kalymmatonema gypsitolerans NIES-4073, so searching the published name finds nothing. None of the 12 Rieske proteins in that genome is annotated as a Rieske oxygenase; this one is annotated ''putative oxidoreductase''. It was identified by length against the Nodularia sphaerocarpa orthologue ULP74381.1 (720 aa, SuoC) and confirmed by genomic context: its immediate neighbour at 4,547,312 is an isopentenyl-diphosphate delta-isomerase, and the region carries NRPS genes and a BacA homologue, which is the signature of the Aeap cluster because Aer3 needs DMAPP. DO NOT CONFUSE with CAD5975418 (366 aa, Planktothrix agardhii), which is also called AerC and FAILS the Rieske motif; it is a different protein. LIGANDS verified in-column by fragment alignment, because a global alignment of a 717 aa protein to the catalytic-centre model covers only 18.9 % and never reaches the catalytic columns, which produced a false 0/3. Rieske C146, H148, C168, H171; bridging D511; mononuclear H513, H518. hmmsearch full length E = 3.8e-68 over three domains, and the orthologue gives identical ligands. CARBOXYLATE IS Asp667, located geometrically on 2026-10-21. The ESMFold model of residues 440-700 places His513 NE2 and His518 NE2 3.22 A apart (naphthalene dioxygenase crystal: 3.49) with Asp667 OD1 at 2.64 A and OD2 at 3.21 A from them (NDO Asp362: 3.41 and 3.20); the runner-up, Glu510, is 4.18 A away, so the assignment is not ambiguous. The Rieske site was verified the same way: all six inter-ligand distances for C146/H148/C168/H171 fall within 0.34 A of the same method applied to NDO, whose own crystal geometry the method reproduces to about 0.3 A. D511 sits 8.4-9.2 A from the mononuclear histidines, which is where a bridging aspartate belongs: in NDO the bridging Asp205 is 5.2-8.6 A from the mononuclear histidines, 7.5 A from the ADJACENT subunit''s Rieske cluster and 46.7 A from its own. These are predictions of isolated domains, not an experimental structure, and no metal was modelled; mutagenesis would settle Asp667. Evidence: analysis_out/aerc_structure/aerc_metal_sites.json. The column test still scores 2/3 because the model region holding the carboxylate column has no counterpart here, which remains a statement about the alignment, not the protein. substrate_smiles and a product SMILES are left EMPTY on purpose: no SMILES for N4-isopentenylagmatine or Aeap was verified, and a wrong one is worse than a missing one.'
