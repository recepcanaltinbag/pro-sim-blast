notes: 'SUBSTRATE CORRECTED 2026-10-28. The record previously gave the substrate as "benzene and fluorene" with the fluorene SMILES, and its own note admitted the assignment was weak. Both the GenBank and the UniProt annotation of the accession whose sequence is byte-identical to the one stored here name the protein the alpha subunit of BUPROFEZIN dioxygenase (gene bfzA1), and the primary paper states that degradation of buprofezin is initiated by dihydroxylation of its benzene ring. The reaction class is therefore unchanged (cis-dihydroxylation); the substrate, its SMILES and the product are. CURATOR DECISION PENDING on family: it was "pah", which is wrong because buprofezin carries a single benzene ring and is not a polycyclic aromatic hydrocarbon. It is recorded as "anilines" because the ring that is oxidised is an N-substituted benzene, as in the two existing members of that family; but the nitrogen here is amide-like rather than an amine, so a curator may prefer a new vocabulary entry for pesticide heterocycles.'
