notes: 'Proposed as the single reference for the prodiginine-cyclase family, which has no counterpart in the set at all. The family members I retrieved are 42-65% identical to each other (RedG/McpG 56.4%, RedG/MarG 64.5%, RedG/RphG2 53.0%, RphG2/RphG4 65.4%), so RedG, 1_119_McpG and 1_120_MarG are proposed as three references and the two roseophilin oxygenases are NOT proposed at all (see analysis_out/new_reference_candidates.json). reaction_class "C_C_bond_formation" is NEW vocabulary. Product SMILES is left unrecorded: streptorubrin B was not found in PubChem by the harvest and the schema has no product_smiles field anyway. family "alkaloids" is the existing token, prodiginines being pyrrole alkaloids. The UniProt entry is unreviewed and titled only "Oxidase", so the gene name and the primary paper carry the identification. OXYGEN IS NOT INCORPORATED (recorded 2026-10-28). The formulae show a net loss of two hydrogens and no gain of oxygen: undecylprodigiosin C25H35N3O -> streptorubin B C25H33N3O (PubChem CID 135515151 -> 135515502). O2 is the oxidant here, not an oxygen donor, so this enzyme is mechanistically an oxidase/desaturase. Calling it a Rieske OXYGENASE is a statement of family membership -- it carries the Rieske cluster and the mononuclear iron site -- and must not be read as a claim that oxygen is transferred to the product.'
