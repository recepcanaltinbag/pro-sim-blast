oxygen_fate_basis: 'one oxygen atom from O2 IS incorporated into the product. BRENDA gives the reaction of EC 1.14.15.7 as ''choline + O2 + 2 reduced ferredoxin + 2 H+ = betaine aldehyde HYDRATE + H2O + 2 oxidized ferredoxin'', and that balances as choline C5H14NO+ + O2 -> hydrate C5H14NO2+ + H2O: one oxygen into the product, one into water, the ordinary monooxygenase stoichiometry. EC class 1.14.15 is defined as ''incorporation of one atom of oxygen into the other donor''. The free aldehyde C5H12NO+ is the DEHYDRATED equilibrium form, not what the enzyme releases; computing the balance from it gives a loss of two hydrogens and no oxygen gain, which is how this field was twice recorded wrongly before the reaction was checked against BRENDA on 2026-10-28.'
