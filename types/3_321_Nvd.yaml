notes: 'The one candidate both documented gaps point at: the audit names "cholesterol 7-desaturase / DAF-36" among the eukaryotic families with no reference, and harvest NT-09 proposes the same enzyme as Nvd/Neverland. Substrate and product SMILES are the curated ones recorded in literature_harvest.json (PubChem CID 5997 and 439423); only substrate_smiles has a field in this schema, so the product SMILES is not stored. reaction_class "desaturation" is NEW vocabulary -- the existing 67 have no desaturase. Nvd and DAF-36 (3_322_DAF36) are only 36.8% identical, so they are proposed as two references, not one. OXYGEN IS NOT INCORPORATED (recorded 2026-10-28). The formulae show a net loss of two hydrogens and no gain of oxygen: cholesterol C27H46O -> 7-dehydrocholesterol C27H44O (PubChem CID 5997 -> 439423). O2 is the oxidant here, not an oxygen donor, so this enzyme is mechanistically an oxidase/desaturase. Calling it a Rieske OXYGENASE is a statement of family membership -- it carries the Rieske cluster and the mononuclear iron site -- and must not be read as a claim that oxygen is transferred to the product.'
