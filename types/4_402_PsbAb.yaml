notes: '4-sulfobenzoate 3,4-dioxygenase. The oxygenase component was shown by electron paramagnetic resonance to carry a Rieske [2Fe-2S] centre. SUBSTRATE, PRODUCT AND ORGANISM CORRECTED 2026-10-28. The record gave the substrate as 4-sulfobenzoate and cited PMID:8828208 (Comamonas testosteroni PSB-4 and T-2). That paper is about a different organism''s enzyme and nothing in it covers this sequence. The sequence stored here is byte-identical to GenBank BAA82116.1, which GenBank labels psbAb of Rhodopseudomonas palustris, and the paper that deposited it is ''Cloning of Genes Participating in Aerobic Biodegradation of p-Cumate from Rhodopseudomonas palustris''. The gene sits in a p-cumate degradation cluster whose sequence resembles the P. putida cmt genes, and BAA82116.1 aligns to the P. putida p-cumate dioxygenase large subunit at about 39-40% identity. The chemistry is therefore recorded to match 4_401_CmtAb, the characterised p-cumate 2,3-dioxygenase of P. putida F1. CAVEAT: the literature names the large subunit of this cluster inconsistently, psbAb in one alignment and psbAc in a comparative figure; the label used here follows the GenBank record of this exact sequence, whose /gene is psbAb. The assignment rests on gene-cluster context and homology, not on an assay of this purified subunit, so chemistry_evidence stays ''curated''.'
