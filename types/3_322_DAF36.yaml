notes: 'The nematode/vertebrate arm of the same family as 3_321_Nvd. Proposed separately because the two are 36.8% identical over 82% of their length, and the database entries the audit found are split across both arms (one Drosophila mauritiana "cholesterol 7-desaturase isoform X9" against daf-36-like proteins from Notothenia coriiceps, Nothobranchius furzeri, Carassius auratus and Geotrypetes seraphini). A single reference at 37% identity would not read the other arm. If the curator wants only one, keep 3_321_Nvd, which the thesis names, and drop this one. reaction_class "desaturation" is NEW vocabulary. SMILES as in NT-09. OXYGEN IS NOT INCORPORATED (recorded 2026-10-28). The formulae show a net loss of two hydrogens and no gain of oxygen: cholesterol C27H46O -> 7-dehydrocholesterol C27H44O (PubChem CID 5997 -> 439423). O2 is the oxidant here, not an oxygen donor, so this enzyme is mechanistically an oxidase/desaturase. Calling it a Rieske OXYGENASE is a statement of family membership -- it carries the Rieske cluster and the mononuclear iron site -- and must not be read as a claim that oxygen is transferred to the product.'
