retired_because: "Identical 470 aa sequence, but this is not a naming duplicate -- it is a mislabelling. The retired entry was called NDO and carried PDB 1NDO, yet its own sequence is only 27.5 % identical to 1NDO and 100 % identical to NarAa. It is the Rhodococcus sp. NCIMB 12038 naphthalene dioxygenase (PDB 2B1X), not the Pseudomonas enzyme. No synonym is recorded, because 'NDO' was simply the wrong name for this sequence."
