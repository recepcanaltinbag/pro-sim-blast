notes: 'Three-component system; the oxygenase gene cndA sits in a transposable element conserved between strains, while its ferredoxin and GR-type reductase are encoded elsewhere. Structure shown is alachlor. PRODUCT CORRECTED 2026-10-28 against the official equation. The record said ''the corresponding aldehyde''; UniProt/Rhea give EC 1.14.15.23 as ''butachlor + 2 reduced [2Fe-2S]-[ferredoxin] + O2 + 2 H(+) = butyl formate + N-(2,6-diethylphenyl)-2-chloroacetamide + ...'', with methyl formate from alachlor and ethyl formate from acetochlor. The released fragment is an alkyl FORMATE ESTER, not an aldehyde: hydroxylation of the N-CH2-O carbon gives a hemiorthoester that collapses to the amide plus the formate.'
