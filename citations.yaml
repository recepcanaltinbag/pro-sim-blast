# ATIF KUTUGU -- tek kaynak.
#
# NEDEN BU DOSYA VAR. Atiflar sitenin her yerine dagilmisti: types/*.yaml
# icindeki `source` alanlarinda serbest metin, disagreements.py icinde gomulu
# DOI'ler, batie_classes.yaml icinde ayri bir kaynak blogu. 75 tipin yalnizca
# 7'sinde cozulebilir bir tanimlayici (DOI/PMID/PDB) vardi; gerisi "established
# literature on the reference enzyme, no individual citation recorded" diyordu.
# Ayni makaleye iki yerde atif yapilip biri guncellenirse ikisi ayrisir.
#
# KURAL. Buraya yalnizca DOGRULANMIS atiflar girer. Bir DOI, ya elimizdeki PDF'in
# kendi ilk sayfasindan, ya UniProt/PubMed/Crossref kaydindan okunmustur.
# UYDURULMUS ya da hatirlanan DOI GIRMEZ -- yanlis atif, atifsizdan kotudur.
#
# ALAN ANLAMLARI
#   id          : kisa anahtar; types/*.yaml ve betikler bu anahtarla atif verir
#   verified_by : bu kaydin NEREDEN dogrulandigi. "local_pdf" = articles/ altinda
#                 duran dosyanin ilk sayfasindan okundu.
#   local_pdf   : varsa, depodaki dosya (articles/ depoya DAHIL DEGIL, .gitignore)
#
# CROSSREF DOGRULAMASI. 2026-10-14'te sekiz DOI'nin sekizi de Crossref API'sinden
# cozuldu ve basliklar/kunyeler kutukle karsilastirildi. Iki kayitta eksik kunye
# Crossref'ten tamamlandi: Higgins 2000 (cilt 267, s.4763-4769) ve Kelly 1996
# (s.251-260). Yeni bir atif eklenince ayni kontrol yapilir:
#     python3 citations_check.py

