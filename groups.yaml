# RO gruplari -- kimlik, etiket ve gerekce.
#
# NEDEN BU DOSYA VAR. Gruplar bu veritabaninda kume kimliginin ilk hanesi
# olarak yasiyordu ve BASKA HICBIR YERDE tanimli degillerdi: sitede "group 1"
# diye geciyor, ne oldugunu soyleyen bir satir yok. Yeni bir grup eklemek de
# bu yuzden belirsizdi.
#
# ETIKETLER VERIDEN TURETILDI, uydurulmadi. Her satirin altindaki sayilar
# 2026-10-14 tarihli veritabanindan olculmustur (19.074 dogrulanmis giris).
# Bunlar bir SINIFLANDIRMA IDDIASI DEGIL -- yayimlanmis Batie ya da Kweon
# semalarina karsilik geldigi one surulmuyor; yalnizca bu sette her grubun
# ne icerdigini ozetliyorlar.
#
# BATIE SINIFLARIYLA KARISTIRMA. Literaturde RO'lar bes Batie sinifina
# ayrilir (IA, IB, IIA, IIB, III) ve bu dosyada da bes grup vardi -- bu bir
# TESADUF. Batie elektron zincirinin mimarisine gore ayirir (reduktaz ve
# ferredoksin tipi), burasi ise alfa alt biriminin dizisine gore. Kanit:
# Batie IB'nin iki ornegi OMO ve BZDO, bu veritabaninda sirasiyla grup 1
# (1_101_OxoO) ve grup 4 (4_411_XylX) -- tek sinif, iki grup. Ayrica CARDO
# Batie tablosunda uc ayri sinifta geciyor (sus KA1 IIA, IC177 IIB, CA10/J3
# III), yani Batie sinifi enzimin degil SUSUN ozelligi. Ayrintisi ve kaynagi:
# batie_classes.yaml. Altinci grup eklemek Batie'nin besine dokunmaz.
#
# 6 VE 7 NUMARA OLARAK YAYIMLANMAZ (2026-11-01). Kullanici uyardi: "group 6"
# / "group 7" yazmak, literaturde karsiligi olmayan bir grup numarasi
# cagristiriyor -- numara yayimlanmis bir semaya atiftir ve literaturde BES
# grup var. Sitede bu ikisi artik "ungrouped" diye gecer ve adlariyla
# soylenir: "plant chlorophyll ROs (PAO, CAO, PTC52)" ve "AerC". Numaralar
# `ro_group` sutununda KIMLIK olarak kalir; degisen sey ETIKET.
#
# YENI GRUP ONERMEK ICIN NE GEREKIR. "proposed group VI (this study)" demek
# bootstrap destekli bir agac gerektirir. Elimizdeki destek degerleri
# FastTree'nin SH-BENZERI YEREL destegi, bootstrap DEGIL -- hizalama
# kolonlari yeniden orneklenmiyor (tree_meta.json: support_is_bootstrap
# false). Olcum id 6'nin agacta tek dal oldugunu soyluyor (guvenle atanmis
# kesimde 26/26, kuratorlu referanslarda 3/3; analysis_out/
# group_monophyly.json) ve tam bu yuzden cazip. Ama tek dal olmak bir grup
# onerisinin kaniti DEGILDIR; dalin ne kadar saglam oldugunu soyleyen sey
# destek, ve bizim destegimiz o iddiayi tasimaz.
#
# ONEMLI: grup, canlI alemine gore DEGIL. Bitki kolin monooksijenazlari
# (CmoS, CmoB, CmoA) okaryottur ve grup 5'tedir. Grup 6 "okaryot grubu"
# degildir; hizalanabilirlige gore ayrilmistir -- asagida yaziyor.

# UYE VE TIP SAYILARI BU DOSYADA TUTULMAZ (2026-11-01). Tutuluyordu ve
# BAYATLAMISLARDI: grup 1 icin "members: 5746, types: 14" yaziyordu, olcum
# 5104 uye / 16 tip; grup 6 icin "0 / 0" yaziyordu, olcum 617 uye / 3 tip.
# Ayni sayinin iki yerde durmasi bu projede tekrar eden hata sinifinin ta
# kendisi. Sayilar artik yalnizca veritabanindan OLCULUR; bu dosya grubun
# NE OLDUGUNU (etiket, mimari, gerekce, literaturle iliskisi) tasir.

groups:
  - id: 1
    is_literature_group: true
    label: "Alkaloid and aryl-ether monooxygenases"
    architecture: "alpha3"
    beta_rate: 0.01
    dominant_reactions: [hydroxylation, N_demethylation]
    dominant_families: [alkaloids, biaryls_ethers]

  - id: 2
    is_literature_group: true
    label: "Biphenyl and alkylbenzene dioxygenases"
    architecture: "alpha3beta3"
    beta_rate: 0.80
    dominant_reactions: [cis_dihydroxylation, dioxygenation_with_release]
    dominant_families: [biaryls_ethers, alkylbenzenes]

  - id: 3
    is_literature_group: true
    label: "Polycyclic aromatic and nitroarene dioxygenases"
    architecture: "mixed"
    beta_rate: 0.27
    dominant_reactions: [cis_dihydroxylation, dioxygenation_with_release]
    dominant_families: [pah, nitroaromatics]

  - id: 4
    is_literature_group: true
    label: "Aromatic acid and aniline dioxygenases"
    architecture: "alpha3beta3"
    beta_rate: 0.76
    dominant_reactions: [cis_dihydroxylation, dioxygenation_with_release]
    dominant_families: [aromatic_acids, anilines]

  - id: 5
    is_literature_group: true
    label: "Quaternary amine oxygenases"
    architecture: "alpha3"
    beta_rate: 0.00
    dominant_reactions: [hydroxylation, N_demethylation, C_N_cleavage]
    dominant_families: [quaternary_amines]
    note: >
      The cleanest group in the set: all eight types act on quaternary amines,
      and not one member carries a beta subunit. It also holds the plant
      choline monooxygenases, which is why membership of a group is not a
      statement about the domain of life.

  - id: 6
    label: "Plastid chlorophyll-pathway oxygenases"
    published_as: "ungrouped (plant chlorophyll ROs: PAO, CAO, PTC52)"
    is_literature_group: false
    architecture: "alpha3"
    beta_rate: null
    dominant_reactions: [oxygenolytic_ring_opening, hydroxylation]
    dominant_families: [chlorophyll_pathway]
    added_on: 2026-10-14
    note: >
      Added for pheophorbide a oxygenase, chlorophyllide a oxygenase and
      PTC52 -- plastid enzymes of chlorophyll metabolism.

      Separated on ALIGNABILITY, not on domain of life. No existing reference
      aligns to them beyond the Rieske domain: the best hits cover only 30-34 %
      of the query, which is the sequence-level form of what the carboxylate
      audit found structurally, where a C-terminal catalytic-lobe probe scored
      on 2.7 % of this set against 57.7 % of ordinary members. Folding them
      into group 1 would redefine that group's alignment columns using
      sequences that cannot be aligned over the catalytic lobe, which is the
      exact fault that made 1,388 carboxylates read as absent when they were
      present.

      They are 23-32 % identical to one another over 57-87 % of their length,
      so they form a family rather than a set of singletons, and none carries
      a beta subunit.

      NOT called "the eukaryotic group" on purpose: CmoS, CmoB and CmoA are
      eukaryotic and belong to group 5, and Nvd and DAF-36 are animal sterol
      desaturases that align full length to group 3. A label by domain of life
      would contradict the data.

  - id: 7
    label: "Long Rieske oxygenases with an inserted catalytic lobe"
    published_as: "ungrouped (AerC)"
    is_literature_group: false
    architecture: "unknown"
    beta_rate: null
    dominant_reactions: [C_C_cleavage, C_C_bond_formation]
    dominant_families: [alkaloids]
    added_on: 2026-10-21
    note: >
      Added for AerC (7_701_AerC), the aeruginosin-pathway Rieske oxygenase of
      Kalymmatonema gypsitolerans NIES-4073, which performs oxidative
      carbocyclisation and C-C bond cleavage in one active site
      (doi:10.1021/jacs.5c01994).

      Separated on ALIGNABILITY, the same ground as group 6 and a more extreme
      case of it. AerC is 717 aa, far outside the 330-460 aa range of the other
      references, and the Rieske domain sits at residue 146 while the
      mononuclear site sits at 511; in an ordinary alpha subunit that spacing is
      about 80 to 210. There is a large insertion between the two, so a global
      alignment to the catalytic-centre model covers only 18.9 % of the model
      and stops at column 231, never reaching the catalytic columns. Folding
      AerC into any existing group would redefine that group's alignment columns
      using a sequence that cannot be aligned across the catalytic lobe.

      THE GROUP IS NOT A SINGLETON, and this was measured before the type was
      admitted. A single-sequence AerC profile run against the 26,693 candidate
      proteins passes the 0.45 coverage gate on 18 of them and covers those 18
      at 0.84-1.00 (median 0.98). Those same 18 are currently assigned to
      5_507_BmoA (426 aa) and 3_311_PhtAa (462 aa) at coverage 0.21-0.33, that
      is over roughly a fifth of their length. So admitting AerC does not take
      members on a technicality; it repairs 18 assignments whose present
      reference matches a fragment of the protein. The Nodularia sphaerocarpa
      orthologue ULP74381.1 (720 aa, SuoC) carries the same ligands at the same
      columns.

      OPEN: the mononuclear carboxylate is present on biochemical grounds (the
      paper measures 3.00 +/- 0.02 Fe per monomer, that is 2 Fe Rieske plus 1 Fe
      mononuclear) but its RESIDUE could not be located, because the model
      region that holds that column has no counterpart in AerC. Recorded as
      roadmap item 68; see analysis_out/aerc_resolution.json.

      members and beta_rate are null until the pipeline has been rerun with this
      reference in the library; they are not guesses.
