# NEDEN BU DOSYA VAR  (2026-11-02)
#
# Kullanici: "rieskelerin onemli oldugunu insanlar direkt anlamali", sonra
# "daha genel temel kapsayici anladin mi ROlar ile ilgili".
#
# ILK SURUM FAZLA DARDI. Kartlar kirletici parcalanmasi ile basliyordu;
# o bir UYGULAMA, ailenin tanimi degil. Rieske oksijenazlari temelde
# tanimlayan sey: tek zincirde iki demir merkezi, O2 ile zor oksidasyonlar,
# ve bunun yasamin uc alanina birden yayilmis olmasi. Kartlar artik bu uc
# ekseni olcuyor -- KIMYA, SUBSTRAT, CANLI -- ve kirletici o eksenlerden
# birinin icinde bir ornek olarak geciyor.
#
# ONEM DUZYAZIYLA ANLATILMIYOR: her kart bir OLCUME bagli. Bu dosya TEK
# SAYI tasimaz; `measure` anahtari neyin sayilacagini soyler ve sayim her
# derlemede veritabanindan yapilir, yani bayatlayamaz. Hangi olcunun
# yayinlanacagi bir kurator karari oldugu icin sablona gomulmedi;
# validate_curation.py her `measure` degerinin tanimli oldugunu ve hicbir
# iddianin sifir olcmedigini dogrular.

claims:
  - id: chemistry
    measure: reaction_classes
    label: Two metal centres, twelve different oxidations
    body: >-
      Adding two hydroxyls across a ring at once, hydroxylating an unactivated
      carbon, stripping methyl groups from nitrogen or oxygen, desaturating,
      and cleaving rings open — all from the same pair of metal centres.
    basis: >-
      Distinct reaction classes among the curated enzyme types. The class of
      each type comes from the literature on its reference enzyme; type and
      entry counts are measured from the database on every build.

  - id: substrates
    measure: chemical_families
    label: From aromatic pollutants to chlorophyll
    body: >-
      The same fold is pointed at polycyclic aromatic hydrocarbons,
      chlorinated and nitroaromatics, biphenyls and dioxin-like ethers,
      phthalate plasticisers, sulfonated aromatics, anilines, alkaloids such
      as caffeine, steroid and resin acid skeletons, quaternary-amine
      osmolytes and carnitine, and chlorophyll in senescing leaves.
    basis: >-
      Curated substrate families across the characterised types. The family
      assignment is a curator decision recorded in chemistry.csv; counts are
      measured from the database.

  - id: life
    measure: domains_of_life
    label: Bacteria, archaea and eukaryotes alike
    body: >-
      These are not a bacterial speciality. The architecture is present in
      plants, algae and fungi as well as across the bacterial tree, which is
      why a catalogue of it cannot be built from one clade's genomes.
    basis: >-
      Domain and phylum read from the taxonomy of each entry's source
      replicon, counted from the database. Entries without a genome record
      carry no taxonomy and are not counted here.

